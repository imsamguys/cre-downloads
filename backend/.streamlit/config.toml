[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 2048
maxMessageSize = 2048

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#78A9FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B2330"
textColor = "#F7F9FC"
font = "sans serif"
